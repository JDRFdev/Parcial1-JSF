<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<h:head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Simulador CDT - Resultados</title>
</h:head>
<h:body>       

    <p:growl id="msgs" showDetail="true" life="5000" />

    <h1> Resultados de la Simulación CDT</h1>
    
    <div class="Registros">
        <h:form id="formRegistros">
            
            <p:panel header="Historial de CDT Registrados">
                
                <p:dataTable var="cdt" value="#{Cdt.obtenerCdts()}" 
                             rows="10" paginator="true"
                             emptyMessage="No hay CDT registrados aún."
                             style="width: 100%;">
                    
                    <p:column headerText="Nombre">
                        <h:outputText value="#{cdt.usuario.nombre} #{cdt.usuario.apellidos}" />
                    </p:column>
                    
                    <p:column headerText="Correo">
                        <h:outputText value="#{cdt.usuario.correo}" />
                    </p:column>
                    
                    <p:column headerText="Teléfono">
                        <h:outputText value="#{cdt.usuario.telefono}" />
                    </p:column>
                    
                    <p:column headerText="Días">
                        <h:outputText value="#{cdt.dias}" />
                    </p:column>
                    
                    <p:column headerText="Inversión">
                        <h:outputText value="#{cdt.valorInversion}">
                            <f:convertNumber type="currency" currencySymbol="$" 
                                             maxFractionDigits="0" />
                        </h:outputText>
                    </p:column>
                    
                    <p:column headerText="Tasa Anual (%)">
                        <h:outputText value="#{cdt.tasaInteresAnual}">
                            <f:convertNumber maxFractionDigits="2" />
                        </h:outputText>
                        <h:outputText value=" %" />
                    </p:column>
                    
                    <p:column headerText="Ganancia Bruta">
                        <h:outputText value="#{cdt.calcularGananciaBruta()}">
                            <f:convertNumber type="currency" currencySymbol="$" 
                                             maxFractionDigits="0" />
                        </h:outputText>
                    </p:column>
                    
                    <p:column headerText="Retención (6%)">
                        <h:outputText value="#{cdt.calcularRetencion()}">
                            <f:convertNumber type="currency" currencySymbol="$" 
                                             maxFractionDigits="0" />
                        </h:outputText>
                    </p:column>
                    
                    <p:column headerText="Ganancia Neta">
                        <h:outputText value="#{cdt.calcularGanaciaNeta()}">
                            <f:convertNumber type="currency" currencySymbol="$" 
                                             maxFractionDigits="0" />
                        </h:outputText>
                    </p:column>
                    
                    <p:column headerText="Monto Total">
                        <h:outputText value="#{cdt.calcularMontoTotal()}">
                            <f:convertNumber type="currency" currencySymbol="$" 
                                             maxFractionDigits="0" />
                        </h:outputText>
                    </p:column>
                    
                </p:dataTable>
                
            </p:panel>
            
            <br/>
            <div style="text-align: center;">
            <p:button value="Registrar otro CDT" outcome="index" />  
            </div>
        </h:form>
    </div>

    <br/><br/>

    <div class="footer" style="text-align: center; border-top: 1px solid #ccc; padding-top: 10px; color: #555;">
        <p><strong>Autores:</strong></p>
        <p>Angelo Felipe Salamanca Vargas - Código: 20241578167</p>
        <p>Juan David Rodriguez Fonseca - Código: 20241578204</p>
        <p>Asignatura: Programacion por componentes</p>
    </div>
    
</h:body>
</html>
